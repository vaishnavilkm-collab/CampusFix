
<!DOCTYPE html>
<html>
<head>
    <title>CampusFix - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <h1>CampusFix</h1>
    <p>Create your account</p>

    <h2>Register</h2>

    <form action="http://127.0.0.1:5000/register" method="POST">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Account Type</label>
        <select name="role" id="role" required>
            <option value="">Select account type</option>
            <option value="Student">Student</option>
            <option value="Staff">Staff</option>
        </select>

        <div id="department-section" style="display: none;">
            <label>Department</label>
            <select name="department" id="department">
                <option value="">Select your department</option>
                <option value="IT Support">IT Support</option>
                <option value="Electrical">Electrical</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <label>Email</label>
        <input type="email" name="email" id="email"
               placeholder="Choose Student or Staff first" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Create a password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password"
               placeholder="Confirm your password" required>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="index.html">Login</a>
    </p>

</div>

<script>
    const roleSelect = document.getElementById("role");
    const departmentSection = document.getElementById("department-section");
    const departmentSelect = document.getElementById("department");
    const emailInput = document.getElementById("email");

    roleSelect.addEventListener("change", function () {
        if (this.value === "Staff") {
            departmentSection.style.display = "block";
            departmentSelect.required = true;
            emailInput.placeholder = "e.g. anustaff@campusfix.com";
        } else {
            departmentSection.style.display = "none";
            departmentSelect.required = false;
            departmentSelect.value = "";
            emailInput.placeholder = "e.g. anustudent@campusfix.com";
        }
    });
</script>

</body>
</html>
