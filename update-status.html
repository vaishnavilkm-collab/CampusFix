
<!DOCTYPE html>
<html>
<head>
    <title>CampusFix - Update Status</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="report-container">

    <h1>CampusFix</h1>
    <h2>Update Issue Status</h2>

    <div id="issue-information">
        <p>
            <strong>Issue:</strong>
            <span id="issue-title">Loading...</span>
        </p>

        <p>
            <strong>Location:</strong>
            <span id="issue-location">Loading...</span>
        </p>

        <p>
            <strong>Category:</strong>
            <span id="issue-category">Loading...</span>
        </p>

        <p>
            <strong>Current Status:</strong>
            <span id="current-status">Loading...</span>
        </p>
    </div>

    <form id="status-form" action="/update-status" method="POST">

        <input type="hidden" name="issue_id" id="issue-id">

        <label for="status">Update Status</label>

        <select name="status" id="status" required>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
        </select>

        <label for="remarks">Remarks</label>

        <textarea
            name="remarks"
            id="remarks"
            rows="5"
            placeholder="Enter remarks about the issue"
        ></textarea>

        <button type="submit">Update Status</button>

    </form>

    <p>
        <a href="staff-dashboard.html">Back to Staff Dashboard</a>
    </p>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const issueId = params.get("issue");

const titleElement = document.getElementById("issue-title");
const locationElement = document.getElementById("issue-location");
const categoryElement = document.getElementById("issue-category");
const currentStatusElement = document.getElementById("current-status");
const issueIdInput = document.getElementById("issue-id");
const statusDropdown = document.getElementById("status");

if (issueId) {
    issueIdInput.value = issueId;

    fetch("/staff-issues", { credentials: "same-origin" })
        .then(response => {
            if (!response.ok) {
                throw new Error("Server returned HTTP " + response.status);
            }
            return response.json();
        })
        .then(data => {
            if (!Array.isArray(data.issues)) {
                throw new Error("Issue list is missing from server response.");
            }

            const issue = data.issues.find(
                item => String(item.id) === String(issueId)
            );

            if (!issue) {
                titleElement.textContent = "Issue not found";
                locationElement.textContent = "-";
                categoryElement.textContent = "-";
                currentStatusElement.textContent = "-";
                return;
            }

            titleElement.textContent = issue.title || "-";
            locationElement.textContent = issue.location || "-";
            categoryElement.textContent = issue.category || "-";
            currentStatusElement.textContent = issue.status || "-";

            const currentStatus = issue.status || "Assigned";

            if ([...statusDropdown.options].some(
                option => option.value === currentStatus
            )) {
                statusDropdown.value = currentStatus;
            }
        })
        .catch(error => {
            titleElement.textContent = "Failed to load issue";
            locationElement.textContent = "-";
            categoryElement.textContent = "-";
            currentStatusElement.textContent = "-";

            console.error("CampusFix issue-loading error:", error);
        });

} else {
    titleElement.textContent = "No Issue Selected";
    locationElement.textContent =
        "Please select an issue from Staff Dashboard.";
    categoryElement.textContent = "-";
    currentStatusElement.textContent = "-";
}
</script>

</body>
</html>
