
<!DOCTYPE html>
<html>
<head>
    <title>CampusFix - My Issues</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header>
        <h1>CampusFix</h1>
        <p>My Issues</p>
    </header>

    <main>

        <h2>Reported Issues</h2>

        <div id="issues-container">
            <p>Loading your issues...</p>
        </div>

    </main>

</div>

<script>

fetch("/my-issues", {
    credentials: "include"
})
.then(response => {

    if (!response.ok) {
        throw new Error("Unable to load your issues.");
    }

    return response.json();

})
.then(data => {

    const issues = data.issues || [];
    const container = document.getElementById("issues-container");

    container.innerHTML = "";

    if (issues.length === 0) {
        container.innerHTML = "<p>No issues reported yet.</p>";
        return;
    }

    issues.forEach(issue => {

        const issueCard = document.createElement("div");
        issueCard.className = "issue-card";

        issueCard.innerHTML = `
            <h3 class="issue-title"></h3>

            <p><strong>Category:</strong> ${issue.category || "-"}</p>

            <p><strong>Location:</strong> ${issue.location || "-"}</p>

            <p><strong>Priority:</strong> ${issue.priority || "-"}</p>

            <p><strong>Assigned staff:</strong>
                <span class="staff-name"></span>
            </p>

            <p><strong>Staff email:</strong>
                <span class="staff-email"></span>
            </p>

            <p><strong>Department:</strong>
                <span class="staff-department"></span>
            </p>

            <p><strong>Status:</strong> ${issue.status || "Pending"}</p>

            <p><strong>Reported Date:</strong>
                ${issue.reported_date || "-"}
            </p>

            <a
                href="issue-details.html?issue=${issue.id}"
                class="report-button"
            >
                View Details
            </a>
        `;

        issueCard.querySelector(".issue-title").textContent =
            issue.title || "Untitled issue";

        issueCard.querySelector(".staff-name").textContent =
            issue.staff_name || "Awaiting Staff Assignment";

        issueCard.querySelector(".staff-email").textContent =
            issue.staff_email || "Not assigned yet";

        issueCard.querySelector(".staff-department").textContent =
            issue.staff_department || "Not assigned yet";

        container.appendChild(issueCard);

    });

})
.catch(error => {

    document.getElementById("issues-container").innerHTML =
        "<p>Failed to load issues from the database.</p>";

    console.error(error);

});

</script>

</body>
</html>
