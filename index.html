<!DOCTYPE html>
<html>
<head>
    <title>CampusFix - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <h1>CampusFix</h1>

    <p>Smart Campus Issue Reporting and Resolution System</p>

    <h2>Login</h2>

    <form
        id="login-form"
        action="http://127.0.0.1:5000/login"
        method="POST"
    >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">
            Register
        </a>
    </p>

</div>

<script>

document.getElementById("login-form").addEventListener("submit", function(event) {

    event.preventDefault();

    const formData = new FormData(this);

    fetch("http://127.0.0.1:5000/login", {
        method: "POST",
        body: formData,
        credentials: "include"
    })
    .then(response => response.text())
    .then(message => {

        if (message === "Staff login successful!") {

            window.location.href = "staff-dashboard.html";

        }
        else if (message === "Student login successful!") {

            window.location.href = "student-dashboard.html";

        }
        else if (message === "Admin login successful!") {

            window.location.href = "admin-dashboard.html";

        }
        else {

            alert(message);

        }

    })
    .catch(error => {

        alert("Unable to connect to CampusFix backend.");

        console.error(error);

    });

});

</script>

</body>
</html>
